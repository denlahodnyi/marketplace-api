services:
  backend:
    container_name: marketplace_api
    build:
      target: runner
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      pgbouncer:
        condition: service_healthy

  db:
    container_name: marketplace_db
    image: postgres:18
    volumes:
      - marketplace_db:/var/lib/postgresql
    ports:
      - "20100:5432"
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5432 -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgbouncer:
    container_name: marketplace_pgbouncer
    image: edoburu/pgbouncer:v1.25.2-p0
    ports:
      - 20101:${DB_PORT:-5433}
    env_file:
      - .env
    environment:
      - LISTEN_PORT=${DB_PORT}
      - LISTEN_ADDR=0.0.0.0
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - AUTH_TYPE=scram-sha-256
      - ADMIN_USERS=admin
      - POOL_MODE=transaction
      - DEFAULT_POOL_SIZE=25
      - MIN_POOL_SIZE=5
      - MAX_CLIENT_CONN=200
      - MAX_PREPARED_STATEMENTS=200
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p ${DB_PORT:-5433} -U ${DB_USER} -d ${DB_NAME}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  restore:
    container_name: marketplace_restore
    profiles:
      - drill
    image: postgres:18
    env_file:
      - .env
    volumes:
      - marketplace_restore-db:/var/lib/postgresql
    ports:
      - "20102:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 5
volumes:
  marketplace_db:
    name: marketplace_db
  marketplace_restore-db:
    name: marketplace_restore-db
